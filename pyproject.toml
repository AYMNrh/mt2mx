[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt2mx-evidence"
version = "0.1.0"
description = "Evidence-controlled MT to MX to DFR mapping baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["openpyxl>=3.1", "pypdf>=5"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt2mx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
